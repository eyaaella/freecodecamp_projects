<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #34a853; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #34a853; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .btn-success { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #34a853; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #34a853; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #34a853; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>💼 Gestion Postes</h2>
    <p>Référentiel Emplois</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Postes Totaux</h3>
      <div class="value" id="postesTotaux">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #1a73e8;">
      <h3>Catégories</h3>
      <div class="value" id="nbCategories" style="color: #1a73e8;">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #fbbc04;">
      <h3>Salaire Moyen</h3>
      <div class="value" id="salaireMoyen" style="color: #fbbc04; font-size: 16px;">- FCFA</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-success" onclick="nouveauPoste()">
      <span>➕</span>
      <span>Nouveau Poste</span>
    </button>
    <button class="btn btn-primary" onclick="ouvrirGestionnaire()">
      <span>💰</span>
      <span>Grille Salariale</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <select id="filtreCategorie" onchange="appliquerFiltre()">
        <option value="">Toutes les catégories</option>
        <option value="Topographe">Topographe</option>
        <option value="Ingénieur">Ingénieur</option>
        <option value="Technicien">Technicien</option>
        <option value="Ouvrier">Ouvrier</option>
        <option value="Administratif">Administratif</option>
        <option value="Cadre">Cadre</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('tous')">
      <span>💼</span>
      <span>Voir tous les postes</span>
    </div>
    <div class="menu-item" onclick="naviguer('categories')">
      <span>📑</span>
      <span>Par catégorie</span>
    </div>
    <div class="menu-item" onclick="naviguer('salaires')">
      <span>💰</span>
      <span>Grille salariale</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouveauPoste() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalPoste();
    }

    function naviguer(dest) {
      if (dest === 'tous') google.script.run.naviguerVersPostes();
      else if (dest === 'categories') alert('Navigation vers catégories');
      else if (dest === 'salaires') alert('Navigation vers grille salariale');
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const categorie = document.getElementById('filtreCategorie').value;
      alert('Filtre: ' + (categorie || 'Toutes les catégories'));
    }

    function chargerStats() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('postesTotaux').textContent = result.stats.total || 0;
          document.getElementById('nbCategories').textContent = result.stats.categories || 0;
          document.getElementById('salaireMoyen').textContent = (result.stats.salaireMoyen || 0).toLocaleString() + ' FCFA';
        }
      }).obtenirStatsPostes();
    }

    window.onload = function() {
      chargerStats();
    };
  </script>
</body>
</html>
