<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Contrôleur v2.0 - Sidebar</title>
  <style>
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f8f9fa;
      --accent-primary: #34a853; --accent-danger: #ea4335;
      --text-primary: #333; --text-secondary: #666;
      --border-color: #dee2e6; --shadow: rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --bg-primary: #202124; --bg-secondary: #292a2d;
      --accent-primary: #81c995; --text-primary: #e8eaed;
      --text-secondary: #9aa0a6; --border-color: #3c4043;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    .header { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 18px; margin-bottom: 5px; }
    .container { padding: 15px; }
    .stats-card { background: var(--bg-secondary); border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--accent-primary); box-shadow: 0 2px 8px var(--shadow); }
    .stats-card h3 { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; }
    .stats-card .value { font-size: 28px; font-weight: 700; color: var(--accent-primary); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--accent-primary); margin: 15px 0 10px; border-bottom: 2px solid var(--accent-primary); padding-bottom: 5px; }
    select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; background: var(--bg-secondary); color: var(--text-primary); }
    .nc-urgente { background: #fef3f2; border-left: 4px solid #ea4335; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    .nc-urgente strong { color: #ea4335; display: block; margin-bottom: 3px; }
    .nc-urgente small { color: #666; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✓ Contrôleur v2.0</h1>
    <p>Gestion Contrôles Qualité</p>
  </div>

  <div class="container">
    <div class="section-title">📊 Statistiques</div>

    <div class="stats-card">
      <h3>Contrôles Total</h3>
      <div class="value" id="totalControles">-</div>
    </div>

    <div class="stats-card" style="border-left-color: #1a73e8;">
      <h3>Cette Semaine</h3>
      <div class="value" id="cetteSemaine" style="color: #1a73e8;">-</div>
    </div>

    <div class="stats-card" style="border-left-color: #34a853;">
      <h3>Taux Conformité (%)</h3>
      <div class="value" id="tauxConformite" style="color: #34a853;">-</div>
    </div>

    <div class="stats-card" style="border-left-color: #ea4335;">
      <h3>NC Ouvertes</h3>
      <div class="value" id="ncOuvertes" style="color: #ea4335;">-</div>
    </div>

    <div class="section-title">🔍 Filtres</div>

    <select id="filtreType">
      <option value="">Tous les types</option>
      <option value="Qualité">Qualité</option>
      <option value="Sécurité">Sécurité</option>
      <option value="Environnement">Environnement</option>
      <option value="Conformité">Conformité</option>
    </select>

    <select id="filtreStatut">
      <option value="">Tous les statuts</option>
      <option value="En cours">En cours</option>
      <option value="Clôturé">Clôturé</option>
    </select>

    <div class="section-title">⚡ Actions Rapides</div>

    <button class="btn btn-primary" onclick="nouveauControle()">➕ Nouveau Contrôle</button>
    <button class="btn btn-primary" onclick="afficherGrilles()">📋 Grilles</button>
    <button class="btn btn-primary" onclick="genererRapport()">📄 Rapports</button>

    <div class="section-title">⚠️ NC Urgentes</div>

    <div id="ncUrgentes">
      <div class="nc-urgente">
        <strong>Chargement...</strong>
      </div>
    </div>
  </div>

  <script>
    function chargerStats() {
      google.script.run
        .withSuccessHandler(function(stats) {
          document.getElementById('totalControles').textContent = stats.total;
          document.getElementById('cetteSemaine').textContent = stats.cetteSemaine;
          document.getElementById('tauxConformite').textContent = stats.tauxConformite;
          document.getElementById('ncOuvertes').textContent = stats.ncOuvertes;
          chargerNCUrgentes();
        })
        .obtenirKPIsControleur();
    }

    function chargerNCUrgentes() {
      google.script.run
        .withSuccessHandler(function(controles) {
          let html = '';
          const ncUrgentes = controles.filter(c => c.NonConformites && c.Statut === 'En cours').slice(0, 3);
          
          ncUrgentes.forEach(nc => {
            html += `
              <div class="nc-urgente">
                <strong>${nc.TypeControle}</strong>
                <small>${nc.ProjetID}</small>
              </div>
            `;
          });
          
          document.getElementById('ncUrgentes').innerHTML = html || '<div class="nc-urgente"><strong>Aucune NC urgente</strong></div>';
        })
        .listerControles();
    }

    function nouveauControle() { google.script.run.afficherModalControleur(); }
    function afficherGrilles() { alert('Grilles de contrôle prédéfinies'); }
    function genererRapport() { alert('Génération de rapport PDF'); }

    window.onload = function() {
      chargerStats();
      setInterval(chargerStats, 30000);
    };
  </script>
</body>
</html>
