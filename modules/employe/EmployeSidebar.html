<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Gestion Employés v2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #f8f9fa; color: #333; padding: 15px; max-width: 320px; }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 20px 15px; margin: -15px -15px 20px -15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 12px; opacity: 0.9; }
    .stats-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-left: 4px solid #1a73e8; }
    .stats-card h3 { font-size: 13px; color: #666; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-item { text-align: center; padding: 10px; background: #f8f9fa; border-radius: 6px; }
    .stat-item .label { font-size: 11px; color: #666; margin-bottom: 5px; }
    .stat-item .value { font-size: 20px; font-weight: 700; color: #1a73e8; }
    .filters-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .filters-card h3 { font-size: 13px; color: #666; text-transform: uppercase; margin-bottom: 15px; font-weight: 600; }
    .filter-group { margin-bottom: 12px; }
    .filter-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 500; }
    .filter-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; cursor: pointer; }
    .actions-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: all 0.3s ease; }
    .btn-primary { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; }
    .btn-success { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-warning { background: linear-gradient(135deg, #fbbc04 0%, #ea8600 100%); color: #333; }
    .footer { text-align: center; padding: 15px 0; font-size: 11px; color: #999; border-top: 1px solid #eee; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>👤 Gestion Employés</h2>
    <p>Module v2.0 - TopoGest Pro</p>
  </div>

  <div class="stats-card">
    <h3>📊 Statistiques</h3>
    <div class="stat-grid">
      <div class="stat-item"><div class="label">Total</div><div class="value" id="statTotal">-</div></div>
      <div class="stat-item"><div class="label">Actifs</div><div class="value" id="statActifs" style="color: #34a853;">-</div></div>
      <div class="stat-item"><div class="label">En congé</div><div class="value" id="statConge" style="color: #fbbc04;">-</div></div>
      <div class="stat-item"><div class="label">Ancienneté</div><div class="value" id="statAnciennete" style="color: #4285f4; font-size: 16px;">-</div></div>
    </div>
  </div>

  <div class="filters-card">
    <h3>🔍 Filtres</h3>
    <div class="filter-group">
      <label for="filtreFonction">Fonction</label>
      <select id="filtreFonction">
        <option value="all">Toutes les fonctions</option>
        <option value="Ingénieur">Ingénieur</option>
        <option value="Technicien">Technicien</option>
        <option value="Chef d'équipe">Chef d'équipe</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filtreEquipe">Équipe</label>
      <select id="filtreEquipe"><option value="all">Toutes les équipes</option></select>
    </div>
    <div class="filter-group">
      <label for="filtreStatut">Statut</label>
      <select id="filtreStatut">
        <option value="all">Tous les statuts</option>
        <option value="Actif">Actif</option>
        <option value="Congé">Congé</option>
        <option value="Absent">Absent</option>
      </select>
    </div>
  </div>

  <div class="actions-card">
    <h3>⚡ Actions Rapides</h3>
    <button class="btn btn-primary" onclick="nouvelEmploye()">➕ Nouvel Employé</button>
    <button class="btn btn-success" onclick="ouvrirGestionnaire()">📋 Gestionnaire Complet</button>
    <button class="btn btn-warning" onclick="gestionAbsences()">📅 Gérer Absences</button>
  </div>

  <div class="footer">TopoGest Pro v2.0<br>Module Employés</div>

  <script>
    window.onload = function() { chargerStatistiques(); };

    function chargerStatistiques() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          const kpis = result.kpis;
          document.getElementById('statTotal').textContent = kpis.nombreTotal;
          document.getElementById('statActifs').textContent = kpis.actifs;
          document.getElementById('statConge').textContent = kpis.enConge;
          document.getElementById('statAnciennete').textContent = kpis.ancienneteMoyenne.toFixed(1) + ' ans';
        }
      }).obtenirKPIsEmployes();
    }

    function nouvelEmploye() {
      const nom = prompt('Nom:'); if (!nom) return;
      const prenom = prompt('Prénom:'); if (!prenom) return;
      const telephone = prompt('Téléphone (+237 6 XX XX XX XX):');
      if (!telephone || !telephone.startsWith('+237')) { alert('Téléphone invalide'); return; }
      const email = prompt('Email:');
      if (!email || !email.includes('@')) { alert('Email invalide'); return; }
      
      google.script.run.withSuccessHandler(r => { alert(r.message); chargerStatistiques(); })
        .ajouterEmploye('MAT' + Date.now(), nom, prenom, 'Technicien', telephone, email, new Date(), '', '', 800000);
    }

    function ouvrirGestionnaire() { google.script.run.afficherModalEmploye(); }
    function gestionAbsences() { alert('Fonctionnalité Absences en développement'); }
  </script>
</body>
</html>
