<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #1a73e8; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #1a73e8; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4); }
    .btn-success { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #1a73e8; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #1a73e8; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #1a73e8; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>👤 Gestion Employés</h2>
    <p>Ressources Humaines</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Total Employés</h3>
      <div class="value" id="totalEmployes">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #34a853;">
      <h3>Employés Actifs</h3>
      <div class="value" id="employesActifs" style="color: #34a853;">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #fbbc04;">
      <h3>Ancienneté Moyenne</h3>
      <div class="value" id="ancienneteMoyenne" style="color: #fbbc04;">- ans</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-success" onclick="nouvelEmploye()">
      <span>➕</span>
      <span>Nouvel Employé</span>
    </button>
    <button class="btn btn-primary" onclick="ouvrirGestionnaire()">
      <span>🎛️</span>
      <span>Trombinoscope</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <select id="filtreStatut" onchange="appliquerFiltre()">
        <option value="">Tous les statuts</option>
        <option value="Actif">Actif</option>
        <option value="Congé">Congé</option>
        <option value="Suspendu">Suspendu</option>
      </select>
    </div>
    <div class="filter">
      <select id="filtreEquipe" onchange="appliquerFiltre()">
        <option value="">Toutes les équipes</option>
        <option value="1">Équipe 1</option>
        <option value="2">Équipe 2</option>
        <option value="3">Équipe 3</option>
      </select>
    </div>
    <div class="filter">
      <select id="filtrePoste" onchange="appliquerFiltre()">
        <option value="">Tous les postes</option>
        <option value="Topographe">Topographe</option>
        <option value="Ingénieur">Ingénieur</option>
        <option value="Technicien">Technicien</option>
        <option value="Ouvrier">Ouvrier</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('tous')">
      <span>👤</span>
      <span>Voir tous les employés</span>
    </div>
    <div class="menu-item" onclick="naviguer('organigramme')">
      <span>🏢</span>
      <span>Organigramme</span>
    </div>
    <div class="menu-item" onclick="naviguer('fiches')">
      <span>📋</span>
      <span>Fiches individuelles</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouvelEmploye() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalEmploye();
    }

    function naviguer(dest) {
      if (dest === 'tous') google.script.run.naviguerVersEmployes();
      else if (dest === 'organigramme') alert('Navigation vers organigramme');
      else if (dest === 'fiches') alert('Navigation vers fiches');
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const statut = document.getElementById('filtreStatut').value;
      const equipe = document.getElementById('filtreEquipe').value;
      const poste = document.getElementById('filtrePoste').value;
      alert('Filtres: ' + (statut || 'Tous') + ' / Équipe: ' + (equipe || 'Toutes') + ' / Poste: ' + (poste || 'Tous'));
    }

    function chargerStats() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('totalEmployes').textContent = result.stats.total || 0;
          document.getElementById('employesActifs').textContent = result.stats.actifs || 0;
          document.getElementById('ancienneteMoyenne').textContent = (result.stats.anciennete || 0) + ' ans';
        }
      }).obtenirStatsEmployes();
    }

    window.onload = function() {
      chargerStats();
    };
  </script>
</body>
</html>
