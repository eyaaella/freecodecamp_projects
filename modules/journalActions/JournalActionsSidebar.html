<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Journal v2.0 - Sidebar</title>
  <style>
    :root { --bg-primary: #fff; --bg-secondary: #f8f9fa; --text-primary: #333; --text-secondary: #666; --border-color: #dee2e6; --shadow: rgba(0,0,0,0.1); --accent-primary: #1a73e8; --accent-success: #34a853; --accent-warning: #fbbc04; --accent-danger: #ea4335; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 15px; font-size: 13px; }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 15px; margin: -15px -15px 20px -15px; box-shadow: 0 2px 8px var(--shadow); }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-secondary); border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px var(--shadow); border-left: 3px solid var(--accent-primary); transition: all 0.3s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow); }
    .stat-card h4 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 24px; font-weight: 700; color: var(--accent-primary); }
    .section { background: var(--bg-secondary); border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px var(--shadow); }
    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--accent-primary); border-bottom: 2px solid var(--accent-primary); padding-bottom: 5px; }
    .filter-group { margin-bottom: 12px; }
    .filter-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; }
    .filter-group select, .filter-group input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 12px; background: var(--bg-primary); }
    .btn { width: 100%; padding: 10px 15px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary) 0%, #174ea6 100%); color: white; }
    .btn-success { background: linear-gradient(135deg, var(--accent-success) 0%, #2d8e47 100%); color: white; }
    .btn-warning { background: linear-gradient(135deg, var(--accent-warning) 0%, #ea8600 100%); color: #333; }
    .btn-danger { background: linear-gradient(135deg, var(--accent-danger) 0%, #d33426 100%); color: white; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow); }
    .log-list { max-height: 300px; overflow-y: auto; }
    .log-item { background: var(--bg-primary); border-left: 3px solid var(--accent-primary); padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 11px; }
    .log-item.error { border-left-color: var(--accent-danger); }
    .log-item small { color: var(--text-secondary); display: block; margin-bottom: 3px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-top: 4px; }
    .badge-success { background: var(--accent-success); color: white; }
    .badge-warning { background: var(--accent-warning); color: #333; }
    .badge-danger { background: var(--accent-danger); color: white; }
    .badge-info { background: var(--accent-primary); color: white; }
  </style>
</head>
<body>
  <div class="header"><h2>📝 Journal v2.0</h2><p>Logs & Audit Trail</p></div>
  <div class="stats-grid">
    <div class="stat-card"><h4>Total</h4><div class="value" id="totalLogs">-</div></div>
    <div class="stat-card" style="border-left-color: #34a853;"><h4>Aujourd'hui</h4><div class="value" id="actionsJour" style="color: #34a853;">-</div></div>
    <div class="stat-card" style="border-left-color: #ea4335;"><h4>Erreurs</h4><div class="value" id="erreurs" style="color: #ea4335;">-</div></div>
    <div class="stat-card" style="border-left-color: #fbbc04;"><h4>Modules</h4><div class="value" id="modulesActifs" style="color: #fbbc04;">-</div></div>
  </div>
  <div class="section">
    <div class="section-title">⚙️ Filtres</div>
    <div class="filter-group"><label>Module</label><select id="filterModule"><option value="">Tous</option><option value="UTILISATEUR">Utilisateur</option><option value="PROJET">Projet</option><option value="TACHE">Tâche</option></select></div>
    <div class="filter-group"><label>Action</label><select id="filterAction"><option value="">Toutes</option><option value="LOGIN">Login</option><option value="CREATE">Create</option><option value="UPDATE">Update</option><option value="DELETE">Delete</option><option value="ERROR">Error</option></select></div>
    <div class="filter-group"><label>Date</label><input type="date" id="filterDate"></div>
    <button class="btn btn-primary" onclick="applyFilters()">🔍 Filtrer</button>
  </div>
  <div class="section">
    <div class="section-title">📋 Logs Récents</div>
    <div id="logList" class="log-list"><p style="text-align: center; padding: 20px;">Chargement...</p></div>
  </div>
  <div class="section">
    <div class="section-title">⚡ Actions</div>
    <button class="btn btn-success" onclick="openModal()">📊 Vue Complète</button>
    <button class="btn btn-warning" onclick="exportLogs()">📥 Exporter</button>
    <button class="btn btn-danger" onclick="purgeLogs()">🗑️ Purger</button>
  </div>
  <script>
    function loadStats() {
      google.script.run.withSuccessHandler(function(kpis) {
        document.getElementById('totalLogs').textContent = kpis.total || 0;
        document.getElementById('actionsJour').textContent = kpis.aujourdhui || 0;
        document.getElementById('erreurs').textContent = kpis.erreurs || 0;
        document.getElementById('modulesActifs').textContent = kpis.modulesActifs || 0;
      }).withFailureHandler(console.error).obtenirKPIsJournal();
    }
    function loadLogs() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) displayLogs(result.logs);
      }).withFailureHandler(console.error).obtenirLogsRecentsJournal(20);
    }
    function displayLogs(logs) {
      const list = document.getElementById('logList');
      if (!logs || logs.length === 0) { list.innerHTML = '<p style="text-align: center;">Aucun log</p>'; return; }
      let html = '';
      logs.forEach(log => {
        const cls = log.statutHTTP >= 400 ? 'error' : '';
        const badge = log.action === 'ERROR' ? 'badge-danger' : log.action === 'CREATE' ? 'badge-success' : 'badge-info';
        html += `<div class="log-item ${cls}"><small>${new Date(log.dateHeure).toLocaleString()}</small><strong>${log.module}</strong> - ${log.details}<span class="badge ${badge}">${log.action}</span></div>`;
      });
      list.innerHTML = html;
    }
    function applyFilters() { loadLogs(); }
    function openModal() { google.script.run.afficherModalJournal(); }
    function exportLogs() { alert('Export - À implémenter'); }
    function purgeLogs() { if (confirm('Purger tous les logs ?')) { google.script.run.withSuccessHandler(function(r) { alert(r.message); loadStats(); loadLogs(); }).purgerTousLogs(); } }
    window.onload = function() { loadStats(); loadLogs(); setInterval(loadStats, 30000); };
  </script>
</body>
</html>
