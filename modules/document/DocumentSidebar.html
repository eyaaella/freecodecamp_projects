<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #9c27b0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #9c27b0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(156, 39, 176, 0.4); }
    .btn-success { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .btn-info { background: linear-gradient(135deg, #00acc1 0%, #00838f 100%); color: white; }
    .btn-info:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 172, 193, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #9c27b0; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #9c27b0; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #9c27b0; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter label { display: block; font-size: 11px; color: #666; margin-bottom: 5px; font-weight: 600; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; background: white; }
  </style>
</head>
<body>
  <div class="header">
    <h2>📄 Gestion Documents</h2>
    <p>GED Technique</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Total Documents</h3>
      <div class="value" id="totalDocuments">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #ff9800;">
      <h3>En Attente Validation</h3>
      <div class="value" id="enAttenteValidation" style="color: #ff9800;">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #34a853;">
      <h3>Version Moyenne</h3>
      <div class="value" id="versionMoyenne" style="color: #34a853;">-</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-success" onclick="nouveauDocument()">
      <span>➕</span>
      <span>Nouveau Document</span>
    </button>
    <button class="btn btn-info" onclick="uploadDocument()">
      <span>📤</span>
      <span>Upload</span>
    </button>
    <button class="btn btn-primary" onclick="ouvrirGestionnaire()">
      <span>📋</span>
      <span>Workflow</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <label>Par Type</label>
      <select id="filtreType" onchange="appliquerFiltre()">
        <option value="">Tous les types</option>
        <option value="Plan">Plan</option>
        <option value="Rapport">Rapport</option>
        <option value="Photo">Photo</option>
        <option value="Certificat">Certificat</option>
        <option value="Compte-rendu">Compte-rendu</option>
        <option value="Étude">Étude</option>
        <option value="Devis">Devis</option>
      </select>
    </div>

    <div class="filter">
      <label>Par Statut</label>
      <select id="filtreStatut" onchange="appliquerFiltre()">
        <option value="">Tous les statuts</option>
        <option value="Brouillon">Brouillon</option>
        <option value="Validé">Validé</option>
        <option value="En attente">En attente</option>
        <option value="Rejeté">Rejeté</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('tous')">
      <span>📄</span>
      <span>Voir tous les documents</span>
    </div>
    <div class="menu-item" onclick="naviguer('attente')">
      <span>⏳</span>
      <span>En attente de validation</span>
    </div>
    <div class="menu-item" onclick="naviguer('projet')">
      <span>📁</span>
      <span>Par projet</span>
    </div>
    <div class="menu-item" onclick="naviguer('ouvrage')">
      <span>🏗️</span>
      <span>Par ouvrage</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouveauDocument() {
      ouvrirGestionnaire();
    }

    function uploadDocument() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalDocument();
    }

    function naviguer(dest) {
      if (dest === 'tous') google.script.run.naviguerVersDocuments();
      else if (dest === 'attente') google.script.run.naviguerVersDocuments('En attente');
      else if (dest === 'projet') google.script.run.naviguerVersDocuments('projet');
      else if (dest === 'ouvrage') google.script.run.naviguerVersDocuments('ouvrage');
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const type = document.getElementById('filtreType').value;
      const statut = document.getElementById('filtreStatut').value;
      google.script.run.naviguerVersDocuments(statut, type);
    }

    // Charger les statistiques au démarrage
    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(stats) {
          document.getElementById('totalDocuments').textContent = stats.total || 0;
          document.getElementById('enAttenteValidation').textContent = stats.enAttente || 0;
          document.getElementById('versionMoyenne').textContent = (stats.versionMoyenne || 1.0).toFixed(1);
        })
        .obtenirStatistiquesDocuments();
    };
  </script>
</body>
</html>
