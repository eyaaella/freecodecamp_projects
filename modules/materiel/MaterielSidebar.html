<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #fbbc04 0%, #f9ab00 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #fbbc04; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #fbbc04; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #fbbc04 0%, #f9ab00 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(251, 188, 4, 0.4); }
    .btn-success { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .btn-warning { background: linear-gradient(135deg, #ea4335 0%, #d33b2c 100%); color: white; }
    .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(234, 67, 53, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #fbbc04; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #fbbc04; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #fbbc04; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🔧 Gestion Matériel</h2>
    <p>Équipement Topographique</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Total Matériel</h3>
      <div class="value" id="totalMateriel">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #34a853;">
      <h3>Disponible</h3>
      <div class="value" id="materielDisponible" style="color: #34a853;">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #ea4335;">
      <h3>En Maintenance</h3>
      <div class="value" id="materielMaintenance" style="color: #ea4335;">-</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-success" onclick="nouveauMateriel()">
      <span>➕</span>
      <span>Nouveau Matériel</span>
    </button>
    <button class="btn btn-primary" onclick="ouvrirGestionnaire()">
      <span>📦</span>
      <span>Affecter</span>
    </button>
    <button class="btn btn-warning" onclick="afficherMaintenance()">
      <span>🔧</span>
      <span>Maintenance</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <select id="filtreType" onchange="appliquerFiltre()">
        <option value="">Tous les types</option>
        <option value="GPS RTK">GPS RTK</option>
        <option value="Station totale">Station totale</option>
        <option value="Niveau">Niveau</option>
        <option value="Drone">Drone</option>
        <option value="Théodolite">Théodolite</option>
        <option value="Scanner 3D">Scanner 3D</option>
      </select>
    </div>
    <div class="filter">
      <select id="filtreStatut" onchange="appliquerFiltre()">
        <option value="">Tous les statuts</option>
        <option value="Disponible">Disponible</option>
        <option value="En service">En service</option>
        <option value="En maintenance">En maintenance</option>
        <option value="Hors service">Hors service</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('tout')">
      <span>🔧</span>
      <span>Voir tout le matériel</span>
    </div>
    <div class="menu-item" onclick="naviguer('alertes')">
      <span>⚠️</span>
      <span>Alertes maintenance</span>
    </div>
    <div class="menu-item" onclick="naviguer('historique')">
      <span>📜</span>
      <span>Historique</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouveauMateriel() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalMateriel();
    }

    function afficherMaintenance() {
      ouvrirGestionnaire();
      // TODO: Ouvrir directement l'onglet maintenance
    }

    function naviguer(dest) {
      if (dest === 'tout') google.script.run.naviguerVersMateriel();
      else if (dest === 'alertes') alert('Navigation vers alertes');
      else if (dest === 'historique') alert('Navigation vers historique');
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const type = document.getElementById('filtreType').value;
      const statut = document.getElementById('filtreStatut').value;
      alert('Filtres: ' + (type || 'Tous') + ' / ' + (statut || 'Tous'));
    }

    function chargerStats() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('totalMateriel').textContent = result.stats.total || 0;
          document.getElementById('materielDisponible').textContent = result.stats.disponible || 0;
          document.getElementById('materielMaintenance').textContent = result.stats.maintenance || 0;
        }
      }).obtenirStatsMateriel();
    }

    window.onload = function() {
      chargerStats();
    };
  </script>
</body>
</html>
