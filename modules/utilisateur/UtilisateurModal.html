<!DOCTYPE html>
<html lang="fr">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire d'Utilisateurs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #174ea6 0%, #1967d2 100%);
            padding: 20px;
            color: #202124;
        }

        .modal-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, #174ea6 0%, #1967d2 100%);
            color: white;
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h1 {
            font-size: 28px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e8eaed;
            padding: 0 32px;
        }

        .tab {
            padding: 16px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 500;
            color: #5f6368;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #174ea6;
            background: rgba(23, 78, 166, 0.05);
        }

        .tab.active {
            color: #174ea6;
            border-bottom-color: #174ea6;
            background: white;
        }

        .tab-content {
            display: none;
            padding: 32px;
            max-height: 600px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #5f6368;
            margin-bottom: 8px;
        }

        .form-label.required::after {
            content: ' *';
            color: #ea4335;
        }

        input, select, textarea {
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #174ea6;
            box-shadow: 0 0 0 3px rgba(23, 78, 166, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #174ea6 0%, #1967d2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(23, 78, 166, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(23, 78, 166, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #5f6368;
            border: 1px solid #dadce0;
        }

        .btn-secondary:hover {
            background: #e8eaed;
        }

        .btn-danger {
            background: #ea4335;
            color: white;
        }

        .btn-danger:hover {
            background: #c5221f;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #34a853;
            color: white;
        }

        .btn-success:hover {
            background: #137333;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e8eaed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            position: sticky;
            top: 0;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #5f6368;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e8eaed;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e8eaed;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-admin {
            background: #fce8e6;
            color: #c5221f;
        }

        .badge-chef {
            background: #e8f0fe;
            color: #174ea6;
        }

        .badge-topo {
            background: #e6f4ea;
            color: #137333;
        }

        .badge-lecture {
            background: #fef7e0;
            color: #f9ab00;
        }

        .badge-actif {
            background: #e6f4ea;
            color: #137333;
        }

        .badge-inactif {
            background: #f1f3f4;
            color: #5f6368;
        }

        .action-icons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: #f8f9fa;
            transform: scale(1.1);
        }

        .permissions-grid {
            display: grid;
            gap: 16px;
        }

        .permission-module {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e8eaed;
        }

        .permission-header {
            font-weight: 600;
            color: #174ea6;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .permission-options {
            display: flex;
            gap: 20px;
        }

        .permission-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connexion-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid transparent;
        }

        .connexion-item.success {
            border-left-color: #34a853;
        }

        .connexion-item.failed {
            border-left-color: #ea4335;
        }

        .connexion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .connexion-date {
            font-weight: 600;
            color: #202124;
        }

        .connexion-details {
            font-size: 13px;
            color: #5f6368;
            display: flex;
            gap: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #5f6368;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #174ea6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fce8e6;
            color: #c5221f;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message {
            background: #e6f4ea;
            color: #137333;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e8eaed;
        }
    </style>
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <h1><span>🔐</span> Gestionnaire d'Utilisateurs</h1>
            <button class="close-btn" onclick="window.close()">×</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="changerOnglet('liste')">📋 Liste</button>
            <button class="tab" onclick="changerOnglet('nouveau')">➕ Nouveau</button>
            <button class="tab" onclick="changerOnglet('permissions')">🔑 Permissions</button>
            <button class="tab" onclick="changerOnglet('connexions')">🔄 Connexions</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Onglet Liste -->
        <div id="listeTab" class="tab-content active">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom d'utilisateur</th>
                            <th>Email</th>
                            <th>Niveau</th>
                            <th>Dernière connexion</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="listeUtilisateurs">
                        <tr>
                            <td colspan="7">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <div>Chargement des utilisateurs...</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Onglet Nouveau -->
        <div id="nouveauTab" class="tab-content">
            <form id="formUtilisateur" onsubmit="ajouterUtilisateur(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label required">Nom d'utilisateur</label>
                        <input type="text" id="nomUtilisateur" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label required">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Employé ID</label>
                        <input type="text" id="employeID">
                    </div>

                    <div class="form-group">
                        <label class="form-label required">Niveau d'Accès</label>
                        <select id="niveauAcces" required>
                            <option value="">Sélectionner...</option>
                            <option value="Admin">Administrateur</option>
                            <option value="Chef Projet">Chef de Projet</option>
                            <option value="Topographe">Topographe</option>
                            <option value="Lecture">Lecture seule</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Permissions spéciales</label>
                        <textarea id="permissions" rows="3" placeholder="Permissions additionnelles..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <input type="checkbox" id="actif" checked>
                            <label for="actif">Compte actif</label>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="reinitialiserFormulaire()">
                        <span>↺</span> Réinitialiser
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <span>✓</span> Créer l'utilisateur
                    </button>
                </div>
            </form>
        </div>

        <!-- Onglet Permissions -->
        <div id="permissionsTab" class="tab-content">
            <div class="form-group">
                <label class="form-label">Sélectionner un utilisateur</label>
                <select id="selectUtilisateurPermissions" onchange="chargerPermissionsUtilisateur()">
                    <option value="">Choisir un utilisateur...</option>
                </select>
            </div>

            <div id="gridPermissions" class="permissions-grid" style="margin-top: 24px;">
                <div class="permission-module">
                    <div class="permission-header">📊 Module Projet</div>
                    <div class="permission-options">
                        <div class="permission-option">
                            <input type="checkbox" id="perm_projet_lecture">
                            <label>Lecture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_projet_ecriture">
                            <label>Écriture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_projet_admin">
                            <label>Admin</label>
                        </div>
                    </div>
                </div>

                <div class="permission-module">
                    <div class="permission-header">👷 Module Employé</div>
                    <div class="permission-options">
                        <div class="permission-option">
                            <input type="checkbox" id="perm_employe_lecture">
                            <label>Lecture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_employe_ecriture">
                            <label>Écriture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_employe_admin">
                            <label>Admin</label>
                        </div>
                    </div>
                </div>

                <div class="permission-module">
                    <div class="permission-header">🚗 Module Véhicule</div>
                    <div class="permission-options">
                        <div class="permission-option">
                            <input type="checkbox" id="perm_vehicule_lecture">
                            <label>Lecture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_vehicule_ecriture">
                            <label>Écriture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_vehicule_admin">
                            <label>Admin</label>
                        </div>
                    </div>
                </div>

                <div class="permission-module">
                    <div class="permission-header">📐 Module Équipement</div>
                    <div class="permission-options">
                        <div class="permission-option">
                            <input type="checkbox" id="perm_equipement_lecture">
                            <label>Lecture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_equipement_ecriture">
                            <label>Écriture</label>
                        </div>
                        <div class="permission-option">
                            <input type="checkbox" id="perm_equipement_admin">
                            <label>Admin</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" onclick="sauvegarderPermissions()">
                    <span>✓</span> Sauvegarder les permissions
                </button>
            </div>
        </div>

        <!-- Onglet Connexions -->
        <div id="connexionsTab" class="tab-content">
            <div class="form-group">
                <label class="form-label">Sélectionner un utilisateur</label>
                <select id="selectUtilisateurConnexions" onchange="chargerConnexions()">
                    <option value="">Choisir un utilisateur...</option>
                </select>
            </div>

            <div id="listeConnexions" style="margin-top: 24px;">
                <div class="loading">
                    <div>Sélectionnez un utilisateur pour voir l'historique</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let utilisateurs = [];
        let utilisateurCourant = null;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            chargerUtilisateurs();
        });

        function changerOnglet(onglet) {
            // Désactiver tous les onglets
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // Activer l'onglet sélectionné
            event.target.classList.add('active');
            document.getElementById(onglet + 'Tab').classList.add('active');

            // Charger les données si nécessaire
            if (onglet === 'liste') {
                chargerUtilisateurs();
            } else if (onglet === 'permissions' || onglet === 'connexions') {
                chargerListeUtilisateursSelect();
            }
        }

        function chargerUtilisateurs() {
            const tbody = document.getElementById('listeUtilisateurs');
            tbody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="loading">
                            <div class="spinner"></div>
                            <div>Chargement des utilisateurs...</div>
                        </div>
                    </td>
                </tr>
            `;

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        utilisateurs = result.data || [];
                        afficherUtilisateurs(utilisateurs);
                    } else {
                        afficherErreur(result.message || 'Erreur lors du chargement');
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Aucun utilisateur trouvé</td></tr>';
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Erreur de chargement</td></tr>';
                })
                .obtenirTousUtilisateurs();
        }

        function afficherUtilisateurs(data) {
            const tbody = document.getElementById('listeUtilisateurs');

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Aucun utilisateur trouvé</td></tr>';
                return;
            }

            const html = data.map(user => {
                const niveauClass = {
                    'Admin': 'badge-admin',
                    'Chef Projet': 'badge-chef',
                    'Topographe': 'badge-topo',
                    'Lecture': 'badge-lecture'
                }[user.niveauAcces] || 'badge-lecture';

                return `
                    <tr>
                        <td>${user.id || '-'}</td>
                        <td><strong>${user.nomUtilisateur || '-'}</strong></td>
                        <td>${user.email || '-'}</td>
                        <td><span class="badge ${niveauClass}">${user.niveauAcces || '-'}</span></td>
                        <td>${user.derniereConnexion || 'Jamais'}</td>
                        <td><span class="badge ${user.actif ? 'badge-actif' : 'badge-inactif'}">${user.actif ? 'Actif' : 'Inactif'}</span></td>
                        <td>
                            <div class="action-icons">
                                <button class="icon-btn" onclick="modifierUtilisateur(${user.id})" title="Modifier">✏️</button>
                                <button class="icon-btn" onclick="supprimerUtilisateur(${user.id})" title="Supprimer">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = html;
        }

        function ajouterUtilisateur(event) {
            event.preventDefault();

            const userData = {
                nomUtilisateur: document.getElementById('nomUtilisateur').value,
                email: document.getElementById('email').value,
                employeID: document.getElementById('employeID').value,
                niveauAcces: document.getElementById('niveauAcces').value,
                permissions: document.getElementById('permissions').value,
                actif: document.getElementById('actif').checked
            };

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        afficherSucces('Utilisateur créé avec succès!');
                        reinitialiserFormulaire();
                        chargerUtilisateurs();
                        // Retourner à l'onglet liste
                        document.querySelector('.tab').click();
                    } else {
                        afficherErreur(result.message || 'Erreur lors de la création');
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                })
                .creerUtilisateur(userData);
        }

        function modifierUtilisateur(id) {
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        utilisateurCourant = result.data;
                        // Remplir le formulaire
                        document.getElementById('nomUtilisateur').value = result.data.nomUtilisateur;
                        document.getElementById('email').value = result.data.email;
                        document.getElementById('employeID').value = result.data.employeID || '';
                        document.getElementById('niveauAcces').value = result.data.niveauAcces;
                        document.getElementById('permissions').value = result.data.permissions || '';
                        document.getElementById('actif').checked = result.data.actif;

                        // Passer à l'onglet nouveau
                        document.querySelectorAll('.tab')[1].click();
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                })
                .obtenirUtilisateur(id);
        }

        function supprimerUtilisateur(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur?')) {
                return;
            }

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        afficherSucces('Utilisateur supprimé avec succès!');
                        chargerUtilisateurs();
                    } else {
                        afficherErreur(result.message || 'Erreur lors de la suppression');
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                })
                .supprimerUtilisateur(id);
        }

        function chargerListeUtilisateursSelect() {
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        const selectPerm = document.getElementById('selectUtilisateurPermissions');
                        const selectConn = document.getElementById('selectUtilisateurConnexions');

                        const options = result.data.map(u =>
                            `<option value="${u.id}">${u.nomUtilisateur} (${u.email})</option>`
                        ).join('');

                        selectPerm.innerHTML = '<option value="">Choisir un utilisateur...</option>' + options;
                        selectConn.innerHTML = '<option value="">Choisir un utilisateur...</option>' + options;
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                })
                .obtenirTousUtilisateurs();
        }

        function chargerPermissionsUtilisateur() {
            const userId = document.getElementById('selectUtilisateurPermissions').value;
            if (!userId) return;

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        // Remplir les checkboxes avec les permissions
                        const perms = result.data || {};
                        Object.keys(perms).forEach(key => {
                            const checkbox = document.getElementById('perm_' + key);
                            if (checkbox) checkbox.checked = perms[key];
                        });
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                })
                .obtenirPermissionsUtilisateur(userId);
        }

        function sauvegarderPermissions() {
            const userId = document.getElementById('selectUtilisateurPermissions').value;
            if (!userId) {
                afficherErreur('Veuillez sélectionner un utilisateur');
                return;
            }

            const permissions = {};
            document.querySelectorAll('#gridPermissions input[type="checkbox"]').forEach(cb => {
                const key = cb.id.replace('perm_', '');
                permissions[key] = cb.checked;
            });

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        afficherSucces('Permissions mises à jour avec succès!');
                    } else {
                        afficherErreur(result.message || 'Erreur lors de la mise à jour');
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                })
                .changerPermissions(userId, permissions);
        }

        function chargerConnexions() {
            const userId = document.getElementById('selectUtilisateurConnexions').value;
            if (!userId) {
                document.getElementById('listeConnexions').innerHTML = '<div class="loading">Sélectionnez un utilisateur pour voir l\'historique</div>';
                return;
            }

            document.getElementById('listeConnexions').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Chargement de l'historique...</div>
                </div>
            `;

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result && result.success) {
                        afficherConnexions(result.data || []);
                    } else {
                        document.getElementById('listeConnexions').innerHTML = '<div class="loading">Aucune connexion trouvée</div>';
                    }
                })
                .withFailureHandler(function(error) {
                    afficherErreur('Erreur: ' + error.message);
                    document.getElementById('listeConnexions').innerHTML = '<div class="loading">Erreur de chargement</div>';
                })
                .obtenirHistoriqueConnexions(userId);
        }

        function afficherConnexions(data) {
            const container = document.getElementById('listeConnexions');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">Aucune connexion enregistrée</div>';
                return;
            }

            const html = data.map(conn => `
                <div class="connexion-item ${conn.succes ? 'success' : 'failed'}">
                    <div class="connexion-header">
                        <span class="connexion-date">${conn.date || '-'}</span>
                        <span class="badge ${conn.succes ? 'badge-actif' : 'badge-inactif'}">${conn.succes ? 'Succès' : 'Échec'}</span>
                    </div>
                    <div class="connexion-details">
                        <span>🌐 IP: ${conn.ip || 'N/A'}</span>
                        <span>⏱️ ${conn.heure || '-'}</span>
                        ${conn.appareil ? `<span>📱 ${conn.appareil}</span>` : ''}
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function reinitialiserFormulaire() {
            document.getElementById('formUtilisateur').reset();
            utilisateurCourant = null;
        }

        function afficherErreur(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function afficherSucces(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
