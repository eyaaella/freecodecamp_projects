<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs v2.0 - Sidebar</title>
  <style>
    /* Variables CSS */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --text-primary: #333333;
      --text-secondary: #666666;
      --border-color: #dee2e6;
      --shadow: rgba(0,0,0,0.1);
      --accent-primary: #1a73e8;
      --accent-success: #34a853;
      --accent-warning: #fbbc04;
      --accent-danger: #ea4335;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 15px;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%);
      color: white;
      padding: 15px;
      margin: -15px -15px 20px -15px;
      border-radius: 0;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .header h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 11px;
      opacity: 0.9;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 6px var(--shadow);
      border-left: 3px solid var(--accent-primary);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px var(--shadow);
    }

    .stat-card h4 {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .section {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--accent-primary);
      border-bottom: 2px solid var(--accent-primary);
      padding-bottom: 5px;
    }

    .filter-group {
      margin-bottom: 12px;
    }

    .filter-group label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .filter-group select,
    .filter-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .filter-group select:focus,
    .filter-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .btn {
      width: 100%;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary) 0%, #174ea6 100%);
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--accent-success) 0%, #2d8e47 100%);
      color: white;
    }

    .btn-warning {
      background: linear-gradient(135deg, var(--accent-warning) 0%, #ea8600 100%);
      color: #333;
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--accent-danger) 0%, #d33426 100%);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px var(--shadow);
    }

    .user-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .user-item {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .user-item:hover {
      box-shadow: 0 2px 8px var(--shadow);
      border-color: var(--accent-primary);
    }

    .user-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .user-item small {
      font-size: 11px;
      color: var(--text-secondary);
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      margin-top: 4px;
    }

    .badge-success { background: var(--accent-success); color: white; }
    .badge-warning { background: var(--accent-warning); color: #333; }
    .badge-danger { background: var(--accent-danger); color: white; }
    .badge-info { background: var(--accent-primary); color: white; }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
    }

    .spinner {
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-primary);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🔐 Utilisateurs v2.0</h2>
    <p>Gestion & Authentification</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h4>Total Users</h4>
      <div class="value" id="totalUsers">-</div>
    </div>
    <div class="stat-card" style="border-left-color: #34a853;">
      <h4>Actifs</h4>
      <div class="value" id="actifs" style="color: #34a853;">-</div>
    </div>
    <div class="stat-card" style="border-left-color: #fbbc04;">
      <h4>Dernière 24h</h4>
      <div class="value" id="connexions24h" style="color: #fbbc04;">-</div>
    </div>
    <div class="stat-card" style="border-left-color: #ea4335;">
      <h4>Verrouillés</h4>
      <div class="value" id="verouilles" style="color: #ea4335;">-</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">⚙️ Filtres</div>
    
    <div class="filter-group">
      <label>Rôle</label>
      <select id="filterRole">
        <option value="">Tous les rôles</option>
        <option value="Admin">Admin</option>
        <option value="Manager">Manager</option>
        <option value="User">User</option>
        <option value="Guest">Guest</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Statut</label>
      <select id="filterStatut">
        <option value="">Tous les statuts</option>
        <option value="Actif">Actif</option>
        <option value="Inactif">Inactif</option>
        <option value="Suspendu">Suspendu</option>
        <option value="Verrouillé">Verrouillé</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Recherche</label>
      <input type="text" id="searchUser" placeholder="Nom, email...">
    </div>

    <button class="btn btn-primary" onclick="applyFilters()">🔍 Appliquer</button>
  </div>

  <div class="section">
    <div class="section-title">👥 Utilisateurs Récents</div>
    <div id="userList" class="user-list">
      <div class="loading">
        <div class="spinner"></div>
        <p>Chargement...</p>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">⚡ Actions Rapides</div>
    <button class="btn btn-success" onclick="openModal()">➕ Nouvel Utilisateur</button>
    <button class="btn btn-primary" onclick="viewPermissions()">🔑 Gérer Permissions</button>
    <button class="btn btn-warning" onclick="viewLogs()">📝 Logs Activité</button>
    <button class="btn btn-danger" onclick="viewSecurity()">🔒 Sécurité</button>
  </div>

  <script>
    // Charger les stats
    function loadStats() {
      google.script.run
        .withSuccessHandler(function(kpis) {
          document.getElementById('totalUsers').textContent = kpis.total || 0;
          document.getElementById('actifs').textContent = kpis.actifs || 0;
          document.getElementById('connexions24h').textContent = kpis.connexions24h || 0;
          document.getElementById('verouilles').textContent = kpis.verouilles || 0;
        })
        .withFailureHandler(handleError)
        .obtenirKPIsUtilisateurs();
    }

    // Charger la liste des utilisateurs
    function loadUsers() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            displayUsers(result.utilisateurs);
          } else {
            document.getElementById('userList').innerHTML = 
              '<p style="text-align: center; color: var(--accent-danger);">Erreur: ' + result.message + '</p>';
          }
        })
        .withFailureHandler(handleError)
        .obtenirTousUtilisateurs();
    }

    // Afficher les utilisateurs
    function displayUsers(users) {
      const userList = document.getElementById('userList');
      
      if (!users || users.length === 0) {
        userList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Aucun utilisateur trouvé</p>';
        return;
      }

      let html = '';
      users.slice(0, 10).forEach(user => {
        const badgeClass = user.statut === 'Actif' ? 'badge-success' : 
                          user.statut === 'Inactif' ? 'badge-warning' : 'badge-danger';
        
        html += `
          <div class="user-item" onclick="selectUser('${user.id}')">
            <strong>${user.nom} ${user.prenom}</strong>
            <small>${user.email}</small>
            <small>Rôle: ${user.role}</small>
            <span class="badge ${badgeClass}">${user.statut}</span>
          </div>
        `;
      });

      userList.innerHTML = html;
    }

    // Sélectionner un utilisateur
    function selectUser(userId) {
      console.log('User selected:', userId);
      // TODO: Ouvrir modal avec détails utilisateur
    }

    // Appliquer les filtres
    function applyFilters() {
      const role = document.getElementById('filterRole').value;
      const statut = document.getElementById('filterStatut').value;
      const search = document.getElementById('searchUser').value;

      console.log('Filters:', {role, statut, search});
      // TODO: Implémenter filtrage
      loadUsers();
    }

    // Ouvrir modal
    function openModal() {
      google.script.run.afficherModalUtilisateur();
    }

    // Voir permissions
    function viewPermissions() {
      alert('Fonctionnalité permissions - À implémenter');
    }

    // Voir logs
    function viewLogs() {
      alert('Fonctionnalité logs - À implémenter');
    }

    // Voir sécurité
    function viewSecurity() {
      alert('Fonctionnalité sécurité - À implémenter');
    }

    // Gestion erreurs
    function handleError(error) {
      console.error('Erreur:', error);
      alert('Erreur: ' + (error.message || error));
    }

    // Initialisation
    window.onload = function() {
      loadStats();
      loadUsers();
      
      // Auto-refresh toutes les 30s
      setInterval(loadStats, 30000);
    };
  </script>
</body>
</html>
