<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #1a73e8; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #1a73e8; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4); }
    .btn-success { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .btn-warning { background: linear-gradient(135deg, #fbbc04 0%, #f9ab00 100%); color: white; }
    .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(251, 188, 4, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #1a73e8; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #1a73e8; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #1a73e8; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>📐 Relevés Topographiques</h2>
    <p>GPS - UTM - Altitude</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Relevés Totaux</h3>
      <div class="value" id="relevesTotal">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #34a853;">
      <h3>Validés</h3>
      <div class="value" style="color: #34a853;" id="relevesValides">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #fbbc04;">
      <h3>Précision Moyenne</h3>
      <div class="value" style="color: #fbbc04;" id="precisionMoyenne">- cm</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-success" onclick="nouveauReleve()">
      <span>➕</span>
      <span>Nouveau Relevé</span>
    </button>
    <button class="btn btn-primary" onclick="ouvrirGestionnaire()">
      <span>📐</span>
      <span>Gestionnaire Complet</span>
    </button>
    <button class="btn btn-warning" onclick="importerGPS()">
      <span>📍</span>
      <span>Importer GPS</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <select id="filtreType" onchange="appliquerFiltre()">
        <option value="">Tous les types</option>
        <option value="Nivellement">Nivellement</option>
        <option value="Implantation">Implantation</option>
        <option value="Contrôle">Contrôle</option>
        <option value="Levé">Levé</option>
      </select>
    </div>
    <div class="filter">
      <select id="filtreValidite" onchange="appliquerFiltre()">
        <option value="">Tous</option>
        <option value="Validé">Validé</option>
        <option value="À valider">À valider</option>
        <option value="Rejeté">Rejeté</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('releves')">
      <span>📐</span>
      <span>Voir tous les relevés</span>
    </div>
    <div class="menu-item" onclick="naviguer('carte')">
      <span>🗺️</span>
      <span>Carte Interactive</span>
    </div>
    <div class="menu-item" onclick="naviguer('export')">
      <span>📊</span>
      <span>Export XYZ/KML</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouveauReleve() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalReleve();
    }

    function importerGPS() {
      alert('Importation de données GPS à venir...');
      // TODO: Implémenter l'import GPS
    }

    function naviguer(dest) {
      if (dest === 'releves') google.script.run.naviguerVersReleves();
      else if (dest === 'carte') google.script.run.naviguerVersCarteReleves();
      else if (dest === 'export') google.script.run.afficherExportReleves();
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const type = document.getElementById('filtreType').value;
      const validite = document.getElementById('filtreValidite').value;
      let msg = 'Filtres: ';
      if (type) msg += 'Type=' + type + ' ';
      if (validite) msg += 'Validité=' + validite;
      if (!type && !validite) msg += 'Tous';
      alert(msg);
    }

    function chargerStats() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('relevesTotal').textContent = result.stats.total || 0;
          document.getElementById('relevesValides').textContent = result.stats.valides || 0;
          document.getElementById('precisionMoyenne').textContent = (result.stats.precision || 0).toFixed(1) + ' cm';
        }
      }).obtenirStatsReleves();
    }

    window.onload = function() {
      chargerStats();
    };
  </script>
</body>
</html>
