<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #9c27b0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #9c27b0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(156, 39, 176, 0.4); }
    .btn-success { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #9c27b0; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #9c27b0; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #9c27b0; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>👥 Gestion Équipes</h2>
    <p>Équipes Terrain</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Équipes Totales</h3>
      <div class="value" id="equipesTotales">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #34a853;">
      <h3>Équipes Actives</h3>
      <div class="value" id="equipesActives" style="color: #34a853;">-</div>
    </div>

    <div class="stat-card" style="border-left-color: #fbbc04;">
      <h3>Taux d'Occupation Moyen</h3>
      <div class="value" id="tauxOccupation" style="color: #fbbc04;">-%</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-success" onclick="nouvelleEquipe()">
      <span>➕</span>
      <span>Nouvelle Équipe</span>
    </button>
    <button class="btn btn-primary" onclick="ouvrirGestionnaire()">
      <span>🎛️</span>
      <span>Gestionnaire</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <select id="filtreSpecialite" onchange="appliquerFiltre()">
        <option value="">Toutes les spécialités</option>
        <option value="Topographie">Topographie</option>
        <option value="Génie civil">Génie civil</option>
        <option value="Irrigation">Irrigation</option>
        <option value="Mixte">Mixte</option>
      </select>
    </div>
    <div class="filter">
      <select id="filtreStatut" onchange="appliquerFiltre()">
        <option value="">Tous les statuts</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
        <option value="En mission">En mission</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('toutes')">
      <span>👥</span>
      <span>Voir toutes les équipes</span>
    </div>
    <div class="menu-item" onclick="naviguer('specialites')">
      <span>🔧</span>
      <span>Par spécialité</span>
    </div>
    <div class="menu-item" onclick="naviguer('affectations')">
      <span>📍</span>
      <span>Affectations</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouvelleEquipe() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalEquipe();
    }

    function naviguer(dest) {
      if (dest === 'toutes') google.script.run.naviguerVersEquipes();
      else if (dest === 'specialites') alert('Navigation vers spécialités');
      else if (dest === 'affectations') alert('Navigation vers affectations');
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const specialite = document.getElementById('filtreSpecialite').value;
      const statut = document.getElementById('filtreStatut').value;
      alert('Filtres: ' + (specialite || 'Toutes') + ' / ' + (statut || 'Tous'));
    }

    function chargerStats() {
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          document.getElementById('equipesTotales').textContent = result.stats.total || 0;
          document.getElementById('equipesActives').textContent = result.stats.actives || 0;
          document.getElementById('tauxOccupation').textContent = (result.stats.tauxOccupation || 0) + '%';
        }
      }).obtenirStatsEquipes();
    }

    window.onload = function() {
      chargerStats();
    };
  </script>
</body>
</html>
