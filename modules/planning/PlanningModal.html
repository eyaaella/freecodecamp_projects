<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Planning v2.0 - Modal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 20px; }
    .header h1 { font-size: 24px; }
    .container { padding: 20px; }
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #dee2e6; }
    .tab { padding: 12px 20px; background: #f8f9fa; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tab.active { background: #1a73e8; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .chart-container { position: relative; height: 300px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📅 Gestionnaire de Planning v2.0</h1>
    <p>Planning Gantt, Ressources et Optimisation</p>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('calendrier')">📅 Calendrier</button>
      <button class="tab" onclick="switchTab('gantt')">📊 Gantt</button>
      <button class="tab" onclick="switchTab('ressources')">👥 Ressources</button>
      <button class="tab" onclick="switchTab('conflits')">⚠️ Conflits</button>
      <button class="tab" onclick="switchTab('optimisation')">⚡ Optimisation</button>
      <button class="tab" onclick="switchTab('export')">📥 Export</button>
    </div>

    <div id="calendrier" class="tab-content active">
      <h2>Vue Calendrier</h2>
      <p>Calendrier de planning</p>
    </div>

    <div id="gantt" class="tab-content">
      <h2>Diagramme de Gantt</h2>
      <div class="chart-container">
        <canvas id="chartGantt"></canvas>
      </div>
    </div>

    <div id="ressources" class="tab-content">
      <h2>Disponibilité des Ressources</h2>
      <div class="chart-container">
        <canvas id="chartRessources"></canvas>
      </div>
    </div>

    <div id="conflits" class="tab-content">
      <h2>Conflits de Ressources</h2>
      <div id="listeConflits">Chargement...</div>
    </div>

    <div id="optimisation" class="tab-content">
      <h2>Optimisation du Planning</h2>
      <p>Nivellement des ressources</p>
    </div>

    <div id="export" class="tab-content">
      <h2>Export Planning</h2>
      <button onclick="exporterIcal()">📅 Export iCal</button>
      <button onclick="exporterOutlook()">📧 Export Outlook</button>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function exporterIcal() { alert('Export iCal'); }
    function exporterOutlook() { alert('Export Outlook'); }

    window.onload = function() {
      console.log('Planning Modal v2.0 chargé');
    };
  </script>
</body>
</html>
