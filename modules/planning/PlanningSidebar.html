<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Planning v2.0 - Sidebar</title>
  <style>
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f8f9fa;
      --accent-primary: #1a73e8; --accent-success: #34a853;
      --text-primary: #333; --text-secondary: #666;
      --border-color: #dee2e6; --shadow: rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --bg-primary: #202124; --bg-secondary: #292a2d;
      --accent-primary: #8ab4f8; --text-primary: #e8eaed;
      --text-secondary: #9aa0a6; --border-color: #3c4043;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 20px; text-align: center; }
    .header h1 { font-size: 18px; margin-bottom: 5px; }
    .container { padding: 15px; }
    .stats-card { background: var(--bg-secondary); border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--accent-primary); box-shadow: 0 2px 8px var(--shadow); }
    .stats-card h3 { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; }
    .stats-card .value { font-size: 28px; font-weight: 700; color: var(--accent-primary); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--accent-primary); margin: 15px 0 10px; border-bottom: 2px solid var(--accent-primary); padding-bottom: 5px; }
    select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; background: var(--bg-secondary); color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="header">
    <h1>📅 Planning v2.0</h1>
    <p>Gestion Planning & Gantt</p>
  </div>

  <div class="container">
    <div class="section-title">📊 Statistiques</div>

    <div class="stats-card">
      <h3>Semaines Planifiées</h3>
      <div class="value" id="semainesPlanifiees">-</div>
    </div>

    <div class="stats-card" style="border-left-color: #34a853;">
      <h3>Charge Totale (h)</h3>
      <div class="value" id="chargeTotale">-</div>
    </div>

    <div class="stats-card" style="border-left-color: #ea4335;">
      <h3>Conflits</h3>
      <div class="value" id="conflits">-</div>
    </div>

    <div class="stats-card" style="border-left-color: #fbbc04;">
      <h3>Ressources</h3>
      <div class="value" id="ressources">-</div>
    </div>

    <div class="section-title">🔍 Filtres</div>

    <select id="filtreProjet">
      <option value="">Tous les projets</option>
    </select>

    <select id="filtreStatut">
      <option value="">Tous les statuts</option>
      <option value="Planifié">Planifié</option>
      <option value="En cours">En cours</option>
      <option value="Terminé">Terminé</option>
    </select>

    <div class="section-title">⚡ Actions Rapides</div>

    <button class="btn btn-primary" onclick="nouveauPlanning()">➕ Nouveau Planning</button>
    <button class="btn btn-primary" onclick="afficherGantt()">📊 Gantt</button>
    <button class="btn btn-primary" onclick="optimiserPlanning()">⚡ Optimiser</button>
  </div>

  <script>
    function chargerStats() {
      google.script.run
        .withSuccessHandler(function(stats) {
          document.getElementById('semainesPlanifiees').textContent = stats.semainesPlanifiees;
          document.getElementById('chargeTotale').textContent = stats.chargeTotale;
          document.getElementById('conflits').textContent = stats.conflits;
          document.getElementById('ressources').textContent = stats.ressourcesUtilisees.equipes + stats.ressourcesUtilisees.materiel;
        })
        .obtenirKPIsPlanning();
    }

    function nouveauPlanning() { google.script.run.afficherModalPlanning(); }
    function afficherGantt() { alert('Diagramme de Gantt'); }
    function optimiserPlanning() { alert('Optimisation du planning'); }

    window.onload = function() {
      chargerStats();
      setInterval(chargerStats, 30000);
    };
  </script>
</body>
</html>
