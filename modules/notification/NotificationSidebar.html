<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Notifications v2.0</title>
  <style>
    :root { --bg-primary: #fff; --bg-secondary: #f8f9fa; --text-primary: #333; --text-secondary: #666; --border-color: #dee2e6; --shadow: rgba(0,0,0,0.1); --accent-primary: #1a73e8; --accent-success: #34a853; --accent-warning: #fbbc04; --accent-danger: #ea4335; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 15px; font-size: 13px; }
    .header { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; padding: 15px; margin: -15px -15px 20px -15px; box-shadow: 0 2px 8px var(--shadow); }
    .header h2 { font-size: 18px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
    .badge-notif { background: var(--accent-danger); color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.9; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-secondary); border-radius: 8px; padding: 12px; box-shadow: 0 2px 6px var(--shadow); border-left: 3px solid var(--accent-primary); transition: all 0.3s; }
    .stat-card h4 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 24px; font-weight: 700; color: var(--accent-primary); }
    .section { background: var(--bg-secondary); border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px var(--shadow); }
    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--accent-primary); border-bottom: 2px solid var(--accent-primary); padding-bottom: 5px; }
    .notif-list { max-height: 400px; overflow-y: auto; }
    .notif-item { background: var(--bg-primary); border-left: 3px solid var(--accent-primary); padding: 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
    .notif-item:hover { box-shadow: 0 2px 8px var(--shadow); transform: translateX(3px); }
    .notif-item.unread { background: #e8f4fd; font-weight: 600; }
    .notif-item.success { border-left-color: var(--accent-success); }
    .notif-item.warning { border-left-color: var(--accent-warning); }
    .notif-item.error { border-left-color: var(--accent-danger); }
    .notif-item strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .notif-item p { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
    .notif-item small { font-size: 11px; color: var(--text-secondary); }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-right: 5px; }
    .badge-success { background: var(--accent-success); color: white; }
    .badge-warning { background: var(--accent-warning); color: #333; }
    .badge-danger { background: var(--accent-danger); color: white; }
    .badge-info { background: var(--accent-primary); color: white; }
    .btn { width: 100%; padding: 10px 15px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary) 0%, #174ea6 100%); color: white; }
    .btn-success { background: linear-gradient(135deg, var(--accent-success) 0%, #2d8e47 100%); color: white; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow); }
  </style>
</head>
<body>
  <div class="header">
    <h2>🔔 Notifications <span class="badge-notif" id="badgeNonLues">0</span></h2>
    <p>Centre de notifications</p>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><h4>Total</h4><div class="value" id="totalNotif">-</div></div>
    <div class="stat-card" style="border-left-color: #ea4335;"><h4>Non lues</h4><div class="value" id="nonLues" style="color: #ea4335;">-</div></div>
    <div class="stat-card" style="border-left-color: #34a853;"><h4>Aujourd'hui</h4><div class="value" id="aujourdhui" style="color: #34a853;">-</div></div>
    <div class="stat-card" style="border-left-color: #fbbc04;"><h4>Taux lecture</h4><div class="value" id="tauxLecture" style="color: #fbbc04; font-size: 20px;">-</div></div>
  </div>
  <div class="section">
    <div class="section-title">📬 Notifications Récentes</div>
    <div id="notifList" class="notif-list"><p style="text-align: center; padding: 20px;">Chargement...</p></div>
  </div>
  <div class="section">
    <div class="section-title">⚡ Actions</div>
    <button class="btn btn-success" onclick="marquerToutLu()">✓ Tout marquer lu</button>
    <button class="btn btn-primary" onclick="openModal()">📊 Vue complète</button>
  </div>
  <script>
    function loadStats() {
      google.script.run.withSuccessHandler(function(kpis) {
        document.getElementById('totalNotif').textContent = kpis.total || 0;
        document.getElementById('nonLues').textContent = kpis.nonLues || 0;
        document.getElementById('aujourdhui').textContent = kpis.aujourdhui || 0;
        document.getElementById('tauxLecture').textContent = (kpis.tauxLecture || 0) + '%';
        document.getElementById('badgeNonLues').textContent = kpis.nonLues || 0;
      }).obtenirKPIsNotifications();
    }
    function loadNotifications() {
      const userId = 'USR001'; // TODO: Get current user
      google.script.run.withSuccessHandler(function(result) {
        if (result.success) displayNotifications(result.notifications);
      }).obtenirNotificationsUtilisateur(userId, 10);
    }
    function displayNotifications(notifs) {
      const list = document.getElementById('notifList');
      if (!notifs || notifs.length === 0) { list.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Aucune notification</p>'; return; }
      let html = '';
      notifs.forEach(n => {
        const typeClass = n.type === 'SUCCESS' ? 'success' : n.type === 'WARNING' ? 'warning' : n.type === 'ERROR' || n.type === 'URGENT' ? 'error' : '';
        const unreadClass = n.statut === 'Non lue' ? 'unread' : '';
        const badgeClass = n.type === 'SUCCESS' ? 'badge-success' : n.type === 'WARNING' ? 'badge-warning' : n.type === 'ERROR' || n.type === 'URGENT' ? 'badge-danger' : 'badge-info';
        html += `<div class="notif-item ${typeClass} ${unreadClass}" onclick="markAsRead('${n.id}')"><strong>${n.titre}</strong><p>${n.message}</p><small>${new Date(n.dateEnvoi).toLocaleString()}</small> <span class="badge ${badgeClass}">${n.type}</span></div>`;
      });
      list.innerHTML = html;
    }
    function markAsRead(notifId) {
      google.script.run.withSuccessHandler(function() {
        loadNotifications();
        loadStats();
      }).marquerCommeLue(notifId);
    }
    function marquerToutLu() {
      alert('Fonction à implémenter');
    }
    function openModal() {
      google.script.run.afficherModalNotification();
    }
    window.onload = function() {
      loadStats();
      loadNotifications();
      setInterval(function() { loadStats(); loadNotifications(); }, 30000);
    };
  </script>
</body>
</html>
