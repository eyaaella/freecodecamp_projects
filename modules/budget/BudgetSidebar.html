<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 18px; margin-bottom: 5px; }
    .header p { font-size: 11px; opacity: 0.9; }
    .container { padding: 15px; }
    .stat-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #34a853; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .stat-card h3 { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #34a853; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #34a853 0%, #2d8e47 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 168, 83, 0.4); }
    .btn-success { background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4); }
    .btn-warning { background: linear-gradient(135deg, #fbbc04 0%, #ea8600 100%); color: white; }
    .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(251, 188, 4, 0.4); }
    .section-title { font-size: 13px; font-weight: 600; color: #34a853; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #34a853; }
    .menu-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; border: 1px solid #e0e0e0; }
    .menu-item:hover { background: #34a853; color: white; transform: translateX(3px); }
    .filter { margin-bottom: 15px; }
    .filter select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-left: 5px; }
    .badge-danger { background: #ea4335; color: white; }
    .badge-warning { background: #fbbc04; color: #333; }
  </style>
</head>
<body>
  <div class="header">
    <h2>💰 Gestion Budget</h2>
    <p>Gestion Budgétaire et Financière</p>
  </div>

  <div class="container">
    <div class="stat-card">
      <h3>Budget Total Prévu</h3>
      <div class="value" id="budgetTotal">- FCFA</div>
    </div>

    <div class="stat-card" style="border-left-color: #1a73e8;">
      <h3>Budget Utilisé</h3>
      <div class="value" id="budgetUtilise" style="color: #1a73e8;">- FCFA</div>
    </div>

    <div class="stat-card" style="border-left-color: #ea4335;">
      <h3>Dépassements</h3>
      <div class="value" id="depassements" style="color: #ea4335;">0</div>
    </div>

    <div class="section-title">🎯 Actions Rapides</div>
    <button class="btn btn-primary" onclick="nouveauBudget()">
      <span>➕</span>
      <span>Nouveau Poste Budgétaire</span>
    </button>
    <button class="btn btn-success" onclick="ouvrirGestionnaire()">
      <span>🎛️</span>
      <span>Gestionnaire Complet</span>
    </button>
    <button class="btn btn-warning" onclick="genererRapport()">
      <span>📊</span>
      <span>Rapport Budgétaire</span>
    </button>

    <div class="section-title">🔍 Filtres</div>
    <div class="filter">
      <select id="filtreCategorie" onchange="appliquerFiltre()">
        <option value="">Toutes les catégories</option>
        <option value="Main d'oeuvre">Main d'oeuvre</option>
        <option value="Matériel">Matériel</option>
        <option value="Transport">Transport</option>
        <option value="Études">Études</option>
        <option value="Imprévus">Imprévus</option>
        <option value="Autre">Autre</option>
      </select>
    </div>

    <div class="filter">
      <select id="filtreStatut" onchange="appliquerFiltre()">
        <option value="">Tous les statuts</option>
        <option value="Prévisionnel">Prévisionnel</option>
        <option value="Engagé">Engagé</option>
        <option value="En cours">En cours</option>
        <option value="Soldé">Soldé</option>
        <option value="Dépassé">Dépassé</option>
        <option value="Annulé">Annulé</option>
      </select>
    </div>

    <div class="section-title">📊 Navigation</div>
    <div class="menu-item" onclick="naviguer('budget')">
      <span>💰</span>
      <span>Voir tous les postes</span>
    </div>
    <div class="menu-item" onclick="naviguer('depassements')">
      <span>⚠️</span>
      <span>Postes en dépassement</span>
      <span class="badge badge-danger" id="badgeDepassements">0</span>
    </div>
    <div class="menu-item" onclick="naviguer('projet')">
      <span>📁</span>
      <span>Budget par projet</span>
    </div>
    <div class="menu-item" onclick="naviguer('trimestre')">
      <span>📅</span>
      <span>Budget par trimestre</span>
    </div>
    <div class="menu-item" onclick="naviguer('dashboard')">
      <span>📊</span>
      <span>Tableau de bord</span>
    </div>
    <div class="menu-item" onclick="retourMenu()">
      <span>🏠</span>
      <span>Menu Principal</span>
    </div>
  </div>

  <script>
    function nouveauBudget() {
      ouvrirGestionnaire();
    }

    function ouvrirGestionnaire() {
      google.script.run.afficherModalBudget();
    }

    function genererRapport() {
      alert('Génération du rapport budgétaire...');
      // TODO: Implémenter génération rapport
    }

    function naviguer(dest) {
      if (dest === 'budget') google.script.run.naviguerVersBudget();
      else if (dest === 'dashboard') google.script.run.naviguerVersTableauDeBord();
      else if (dest === 'depassements') {
        google.script.run.naviguerVersBudget();
        alert('Filtrer par statut "Dépassé"');
      }
    }

    function retourMenu() {
      google.script.run.afficherMenuPrincipal();
    }

    function appliquerFiltre() {
      const categorie = document.getElementById('filtreCategorie').value;
      const statut = document.getElementById('filtreStatut').value;
      let msg = 'Filtres appliqués:\n';
      if (categorie) msg += '- Catégorie: ' + categorie + '\n';
      if (statut) msg += '- Statut: ' + statut;
      if (categorie || statut) alert(msg);
    }

    function chargerStats() {
      // TODO: Charger stats réelles depuis backend
      document.getElementById('budgetTotal').textContent = '- FCFA';
      document.getElementById('budgetUtilise').textContent = '- FCFA';
      document.getElementById('depassements').textContent = '0';
      document.getElementById('badgeDepassements').textContent = '0';
    }

    window.onload = function() {
      chargerStats();
    };
  </script>
</body>
</html>
